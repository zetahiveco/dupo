  <!-- Logo mark -->
  <g transform="translate(53 53.75) scale(1.5)" filter="url(#shadow)" fill="#FFFFFF">
    <path d="M173 153 H293 A152.5 152.5 0 0 1 293 458 H173 C205 440 220 385 264 385 A80 80 0 0 0 264 225 C220 225 205 170 173 153 Z"/>
    <circle cx="264" cy="305" r="53"/>
