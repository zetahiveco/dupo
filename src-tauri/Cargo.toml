[package]
name = "dupo"
version = "0.1.0"
edition = "2021"
description = "Design studio for documents, videos, and presentations. Canva-style editor with an MCP server, in a Tauri app."
license = "MIT"
repository = "https://github.com/zetahiveco/dupo"
homepage = "https://dupo.vercel.app"
keywords = ["design", "editor", "presentations", "video", "tauri"]
categories = ["graphics", "multimedia"]

[lib]
name = "dupo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
anyhow = "1"
tauri-plugin-fs = "2"
